name: "Diagnose — KCMI 24-20 벤치마크 격차 (2023)"

# friendly_pct_mean이 KCMI 벤치마크 대비 -2.5~-4.2%p 낮은 원인 진단.
# Step 5(ownership_panel) + Step 9(market_cap) + Step 1c(corp_details) 아티팩트를
# 모두 받아서 시나리오별 평균을 다시 계산.
on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pandas numpy tabulate

      - name: Download Step 5 artifact (ownership_panel.csv)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p data/processed
          ARTIFACT_ID=$(gh api \
            "repos/${{ github.repository }}/actions/artifacts?name=step5-ownership-panel&per_page=1" \
            --jq '.artifacts[0].id // empty')
          if [ -z "$ARTIFACT_ID" ]; then
            echo "::error::Step 5 아티팩트 없음 — 먼저 step5-clean-merge.yml 실행 필요"
            exit 1
          fi
          gh api "repos/${{ github.repository }}/actions/artifacts/$ARTIFACT_ID/zip" > /tmp/step5.zip
          unzip -o /tmp/step5.zip -d data/processed/
          echo "✅ ownership_panel.csv 복원"

      - name: Download Step 1c artifact (corp_details.csv) — 선택
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p data/raw
          ARTIFACT_ID=$(gh api \
            "repos/${{ github.repository }}/actions/artifacts?name=step1c-corp-details-data&per_page=1" \
            --jq '.artifacts[0].id // empty')
          if [ -n "$ARTIFACT_ID" ]; then
            gh api "repos/${{ github.repository }}/actions/artifacts/$ARTIFACT_ID/zip" > /tmp/step1c.zip
            unzip -o /tmp/step1c.zip -d data/raw/
            echo "✅ corp_details.csv 복원"
          else
            echo "⚠️  Step 1c 아티팩트 없음 — 결산월 시나리오 스킵"
          fi

      - name: Download Step 9 artifact (market_cap_raw.csv) — 선택
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARTIFACT_ID=$(gh api \
            "repos/${{ github.repository }}/actions/artifacts?name=step9-market-cap-data&per_page=1" \
            --jq '.artifacts[0].id // empty')
          if [ -n "$ARTIFACT_ID" ]; then
            gh api "repos/${{ github.repository }}/actions/artifacts/$ARTIFACT_ID/zip" > /tmp/step9.zip
            unzip -o /tmp/step9.zip -d data/raw/
            echo "✅ market_cap_raw.csv 복원"
          else
            echo "⚠️  Step 9 아티팩트 없음 — 시총 가중평균 시나리오 스킵"
          fi

      - name: Run diagnose script
        run: python src/diagnose_benchmark_gap.py

      - name: Upload diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnose-benchmark-gap
          path: |
            diagnostics/benchmark_gap_2023.csv
            diagnostics/benchmark_gap_summary.md
          retention-days: 60

      - name: Print summary to job log
        if: always()
        run: |
          if [ -f diagnostics/benchmark_gap_summary.md ]; then
            cat diagnostics/benchmark_gap_summary.md >> $GITHUB_STEP_SUMMARY
          fi

name: "Step 0 — 카나리아 검증 (API 필드명 확인)"

on:
  workflow_dispatch:

jobs:
  canary:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Create .env
        run: echo "DART_API_KEY=${{ secrets.DART_API_KEY }}" > .env

      - name: Download listed_corps.csv (Step 1 artifact)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p data/raw
          ARTIFACT_ID=$(gh api \
            "repos/${{ github.repository }}/actions/artifacts?name=step1-corp-list&per_page=1" \
            --jq '.artifacts[0].id // empty')
          if [ -z "$ARTIFACT_ID" ]; then
            echo "::error::Step 1 아티팩트가 없습니다. 먼저 Step 1을 실행하세요."
            exit 1
          fi
          gh api "repos/${{ github.repository }}/actions/artifacts/$ARTIFACT_ID/zip" > /tmp/step1.zip
          unzip -o /tmp/step1.zip -d data/raw/
          echo "listed_corps.csv 로드: $(tail -n +2 data/raw/listed_corps.csv | wc -l)개사"

      - name: Run canary validation
        run: |
          cd src
          python 00_canary_validation.py

      - name: Summary
        if: always()
        run: |
          cat >> $GITHUB_STEP_SUMMARY << 'EOF'
          ## Step 0 카나리아 검증 결과

          | API | 상태 |
          |-----|------|
          | hyslrSttus (최대주주현황) | 로그 확인 |
          | tesstkAcqsDspsSttus (자사주) | 로그 확인 |
          | mrhlSttus (소액주주) | 로그 확인 |
          | stockTotqySttus (총발행주식수) | 로그 확인 |

          > 상세 필드 검증 결과는 위 Job 로그를 확인하세요.
          > 모든 검증 통과 시 Step 2부터 실행 가능합니다.
          EOF

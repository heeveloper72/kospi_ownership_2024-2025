name: "Step 1 — 상장사 목록 수집"

on:
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read      # artifact 다운로드용

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Create .env
        run: echo "DART_API_KEY=${{ secrets.DART_API_KEY }}" > .env

      # 이전 실행에서 corp_cls 조회가 중단됐을 경우 체크포인트 복원
      - name: Restore corp_cls checkpoint (이전 실행 재개용)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p data/raw
          ARTIFACT_ID=$(gh api \
            "repos/${{ github.repository }}/actions/artifacts?name=step1-corp-list&per_page=1" \
            --jq '.artifacts[0].id // empty')
          if [ -n "$ARTIFACT_ID" ]; then
            echo "이전 아티팩트 발견 (id=$ARTIFACT_ID), 체크포인트 복원 중..."
            gh api "repos/${{ github.repository }}/actions/artifacts/$ARTIFACT_ID/zip" > /tmp/step1.zip
            unzip -o /tmp/step1.zip -d data/raw/
            ls -lh data/raw/
          else
            echo "첫 실행 — 새로 시작"
          fi

      - name: Run Step 1
        run: python src/01_get_corp_list.py

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: step1-corp-list
          path: |
            data/raw/listed_corps.csv
            data/raw/corp_cls_checkpoint.json
            data/raw/corp_info_checkpoint.json
            data/raw/.api_daily_counter.json
          retention-days: 90
          overwrite: true

      - name: Summary
        if: always()
        run: |
          python - <<'EOF'
          import os
          from pathlib import Path

          csv_path = Path("data/raw/listed_corps.csv")
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if not csv_path.exists() or not summary_path:
              raise SystemExit(0)

          try:
              import pandas as pd
              df = pd.read_csv(csv_path, dtype=str)
          except Exception as e:
              with open(summary_path, "a") as f:
                  f.write(f"## Step 1 결과\n\n- CSV 로드 실패: {e}\n")
              raise SystemExit(0)

          total = len(df)
          kospi = int((df.get("market", pd.Series([], dtype=str)) == "KOSPI").sum())
          kosdaq = int((df.get("market", pd.Series([], dtype=str)) == "KOSDAQ").sum())

          est_dt_filled = int(df["est_dt"].fillna("").str.strip().astype(bool).sum()) if "est_dt" in df.columns else 0
          induty_filled = int(df["induty_code"].fillna("").str.strip().astype(bool).sum()) if "induty_code" in df.columns else 0

          lines = [
              "## Step 1 결과",
              "| 항목 | 값 |",
              "|------|---|",
              f"| KOSPI | {kospi:,}개 |",
              f"| KOSDAQ | {kosdaq:,}개 |",
              f"| **합계** | **{total:,}개** |",
              f"| est_dt 수집 | {est_dt_filled:,}/{total:,} |",
              f"| induty_code 수집 | {induty_filled:,}/{total:,} |",
              "",
          ]
          with open(summary_path, "a") as f:
              f.write("\n".join(lines))
          EOF

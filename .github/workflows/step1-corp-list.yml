name: "Step 1 — 상장사 목록 수집"

on:
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read      # artifact 다운로드용

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Create .env
        run: echo "DART_API_KEY=${{ secrets.DART_API_KEY }}" > .env

      # 이전 실행에서 corp_cls 조회가 중단됐을 경우 체크포인트 복원
      - name: Restore corp_cls checkpoint (이전 실행 재개용)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p data/raw
          ARTIFACT_ID=$(gh api \
            "repos/${{ github.repository }}/actions/artifacts?name=step1-corp-list&per_page=1" \
            --jq '.artifacts[0].id // empty')
          if [ -n "$ARTIFACT_ID" ]; then
            echo "이전 아티팩트 발견 (id=$ARTIFACT_ID), 체크포인트 복원 중..."
            gh api "repos/${{ github.repository }}/actions/artifacts/$ARTIFACT_ID/zip" > /tmp/step1.zip
            unzip -o /tmp/step1.zip -d data/raw/
            ls -lh data/raw/
          else
            echo "첫 실행 — 새로 시작"
          fi

      - name: Run Step 1
        run: python src/01_get_corp_list.py

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: step1-corp-list
          path: |
            data/raw/listed_corps.csv
            data/raw/corp_cls_checkpoint.json
            data/raw/.api_daily_counter.json
          retention-days: 90
          overwrite: true

      - name: Summary
        if: always()
        run: |
          if [ -f data/raw/listed_corps.csv ]; then
            TOTAL=$(tail -n +2 data/raw/listed_corps.csv | wc -l)
            KOSPI=$(grep ",KOSPI" data/raw/listed_corps.csv | wc -l)
            KOSDAQ=$(grep ",KOSDAQ" data/raw/listed_corps.csv | wc -l)
            echo "## Step 1 결과" >> $GITHUB_STEP_SUMMARY
            echo "| 시장 | 기업 수 |" >> $GITHUB_STEP_SUMMARY
            echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
            echo "| KOSPI | $KOSPI |" >> $GITHUB_STEP_SUMMARY
            echo "| KOSDAQ | $KOSDAQ |" >> $GITHUB_STEP_SUMMARY
            echo "| **합계** | **$TOTAL** |" >> $GITHUB_STEP_SUMMARY
          fi

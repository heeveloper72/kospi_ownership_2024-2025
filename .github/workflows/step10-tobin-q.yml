name: "Step 10 — Tobin Q 계산 (재무 + 시가총액 병합)"

# H3 분석 준비: financial_raw + market_cap_raw → financial_panel + ownership_financial_panel
# Step 8(재무) + Step 9(KRX 시총) 완료 후 수동 트리거
on:
  workflow_dispatch:

concurrency:
  group: step10-tobin-q
  cancel-in-progress: false

jobs:
  compute:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pandas numpy python-dotenv

      # ── Step 8 아티팩트 복원 (financial_raw.csv) ─────────────────────────
      - name: Download Step 8 artifact (financial_raw.csv)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p data/raw
          ARTIFACT_ID=$(gh api \
            "repos/${{ github.repository }}/actions/artifacts?name=step8-financial-data&per_page=1" \
            --jq '.artifacts[0].id // empty')
          if [ -z "$ARTIFACT_ID" ]; then
            echo "::error::Step 8 아티팩트가 없습니다. step8-financial.yml 완료 후 실행하세요."
            exit 1
          fi
          gh api "repos/${{ github.repository }}/actions/artifacts/$ARTIFACT_ID/zip" > /tmp/step8.zip
          unzip -o /tmp/step8.zip -d data/raw/
          echo "✅ financial_raw.csv 복원 완료"

      # ── Step 9 아티팩트 복원 (market_cap_raw.csv) ─────────────────────────
      - name: Download Step 9 artifact (market_cap_raw.csv)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARTIFACT_ID=$(gh api \
            "repos/${{ github.repository }}/actions/artifacts?name=step9-market-cap-data&per_page=1" \
            --jq '.artifacts[0].id // empty')
          if [ -z "$ARTIFACT_ID" ]; then
            echo "::error::Step 9 아티팩트가 없습니다. step9-market-cap.yml 완료 후 실행하세요."
            exit 1
          fi
          gh api "repos/${{ github.repository }}/actions/artifacts/$ARTIFACT_ID/zip" > /tmp/step9.zip
          unzip -o /tmp/step9.zip -d data/raw/
          echo "✅ market_cap_raw.csv 복원 완료"

      # ── Step 5 아티팩트 복원 (ownership_panel.csv — 통합 패널용) ──────────
      - name: Download Step 5 artifact (ownership_panel.csv)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p data/processed
          ARTIFACT_ID=$(gh api \
            "repos/${{ github.repository }}/actions/artifacts?name=step5-ownership-panel&per_page=1" \
            --jq '.artifacts[0].id // empty')
          if [ -n "$ARTIFACT_ID" ]; then
            gh api "repos/${{ github.repository }}/actions/artifacts/$ARTIFACT_ID/zip" > /tmp/step5.zip
            unzip -o /tmp/step5.zip -d data/processed/
            echo "✅ ownership_panel.csv 복원 완료"
          else
            echo "⚠️  Step 5 아티팩트 없음 — financial_panel.csv만 생성 (통합 패널 스킵)"
          fi

      - name: Run Step 10 (Tobin Q 계산)
        run: python src/10_compute_tobin_q.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: step10-financial-panel
          path: |
            data/processed/financial_panel.csv
            data/processed/ownership_financial_panel.csv
          retention-days: 90
          overwrite: true

      - name: Summary
        if: always()
        run: |
          python - <<'EOF'
          import os
          from pathlib import Path
          import pandas as pd

          lines = ["## Step 10 결과 (Tobin Q 계산)\n"]
          try:
              df = pd.read_csv("data/processed/financial_panel.csv")
              lines.append(f"- financial_panel: **{len(df):,}행**")
              mc = df["market_cap"].notna().sum()
              tq = df["tobin_q"].notna().sum()
              lines.append(f"- 시가총액 매칭: **{mc:,}건** ({mc/len(df)*100:.1f}%)")
              lines.append(f"- Tobin Q 유효: **{tq:,}건** ({tq/len(df)*100:.1f}%)")
              df23 = df[df["year"] == "2023"]
              if not df23.empty:
                  tq23 = df23["tobin_q"].dropna()
                  lines.append(f"- 2023년 Tobin Q: mean={tq23.mean():.3f}, median={tq23.median():.3f}, n={len(tq23):,}")
          except Exception as e:
              lines.append(f"- financial_panel 로드 실패: {e}")

          try:
              df2 = pd.read_csv("data/processed/ownership_financial_panel.csv")
              matched = df2["tobin_q"].notna().sum()
              lines.append(f"- ownership_financial_panel: **{len(df2):,}행** (Tobin Q 매칭 {matched:,}건)")
          except Exception:
              lines.append("- ownership_financial_panel: 미생성 (Step 5 아티팩트 없음)")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              for line in lines:
                  f.write(line + "\n")
          EOF

name: "Step 11~13 — H1·H3·H5 가설 회귀분석"

# 모든 데이터 수집 완료 후 회귀분석을 일괄 실행:
#   Step 11 = H3 (Tobin Q × 친밀우호)
#   Step 12 = H1 (2014 이후 상장)
#   Step 13 = H5 (재벌 × 개혁 DiD)

on:
  workflow_dispatch:
    inputs:
      hypotheses:
        description: "실행할 가설 (H1,H3,H5 / all)"
        type: choice
        options: ["all", "H1", "H3", "H5"]
        default: "all"

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install pandas numpy statsmodels scipy

      - name: Download Step 1 artifact (listed_corps with isu_dt)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p data/raw
          ARTIFACT_ID=$(gh api \
            "repos/${{ github.repository }}/actions/artifacts?name=step1b-listing-dates&per_page=1" \
            --jq '.artifacts[0].id // empty')
          if [ -z "$ARTIFACT_ID" ]; then
            ARTIFACT_ID=$(gh api \
              "repos/${{ github.repository }}/actions/artifacts?name=step1-corp-list&per_page=1" \
              --jq '.artifacts[0].id // empty')
          fi
          if [ -n "$ARTIFACT_ID" ]; then
            gh api "repos/${{ github.repository }}/actions/artifacts/$ARTIFACT_ID/zip" > /tmp/step1.zip
            unzip -o /tmp/step1.zip -d data/raw/
            echo "✅ listed_corps.csv 복원"
          else
            echo "::error::Step 1/1b 아티팩트 없음"
            exit 1
          fi

      - name: Download Step 5 artifact (ownership_panel.csv)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p data/processed
          ARTIFACT_ID=$(gh api \
            "repos/${{ github.repository }}/actions/artifacts?name=step5-panel-data&per_page=1" \
            --jq '.artifacts[0].id // empty')
          if [ -n "$ARTIFACT_ID" ]; then
            gh api "repos/${{ github.repository }}/actions/artifacts/$ARTIFACT_ID/zip" > /tmp/step5.zip
            unzip -o /tmp/step5.zip -d data/processed/
            echo "✅ ownership_panel.csv 복원"
          else
            echo "⚠️  Step 5 아티팩트 없음"
          fi

      - name: Download Step 10 artifact (ownership_financial_panel.csv)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARTIFACT_ID=$(gh api \
            "repos/${{ github.repository }}/actions/artifacts?name=step10-financial-panel&per_page=1" \
            --jq '.artifacts[0].id // empty')
          if [ -n "$ARTIFACT_ID" ]; then
            gh api "repos/${{ github.repository }}/actions/artifacts/$ARTIFACT_ID/zip" > /tmp/step10.zip
            unzip -o /tmp/step10.zip -d data/processed/
            echo "✅ ownership_financial_panel.csv 복원"
          else
            echo "⚠️  Step 10 아티팩트 없음 — 재무 통제변수 없이 H1·H5만 일부 실행"
          fi

      - name: Run H3 (Tobin Q regression)
        if: ${{ inputs.hypotheses == 'all' || inputs.hypotheses == 'H3' }}
        run: python src/11_analyze_h3.py

      - name: Run H1 (post2014 listing)
        if: ${{ inputs.hypotheses == 'all' || inputs.hypotheses == 'H1' }}
        run: python src/12_analyze_h1.py

      - name: Run H5 (chaebol × reform DiD)
        if: ${{ inputs.hypotheses == 'all' || inputs.hypotheses == 'H5' }}
        run: python src/13_analyze_h5.py

      - name: Upload analysis artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: step11-13-hypotheses-results
          path: |
            data/output/h1_*.csv
            data/output/h3_*.csv
            data/output/h5_*.csv
          retention-days: 90
          if-no-files-found: warn

      - name: Summary
        if: always()
        run: |
          python - <<'EOF'
          import os, pandas as pd
          from pathlib import Path

          out = Path("data/output")
          lines = ["## H1·H3·H5 가설 회귀분석 결과\n"]

          for h, label in [("h3", "H3 (Tobin Q × 친밀우호)"),
                             ("h1", "H1 (2014 이후 상장)"),
                             ("h5", "H5 (재벌 × 개혁 DiD)")]:
              sum_path = out / f"{h}_regression_summary.csv"
              if not sum_path.exists():
                  sum_path = out / f"{h}_did_summary.csv"
              if sum_path.exists():
                  df = pd.read_csv(sum_path)
                  lines.append(f"\n### {label}")
                  lines.append(df.to_markdown(index=False))

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("\n".join(lines) + "\n")
          EOF

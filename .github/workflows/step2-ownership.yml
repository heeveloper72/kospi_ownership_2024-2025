name: "Step 2 — 최대주주 데이터 수집"

on:
  workflow_dispatch:
  schedule:
    # 매일 UTC 00:30 (한국 09:30) 자동 실행 — listed_corps.csv 완성 후 활성화
    - cron: "30 0 * * *"

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Create .env
        run: echo "DART_API_KEY=${{ secrets.DART_API_KEY }}" > .env

      - name: Download listed_corps.csv (Step 1 artifact)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p data/raw
          ARTIFACT_ID=$(gh api \
            "repos/${{ github.repository }}/actions/artifacts?name=step1-corp-list&per_page=1" \
            --jq '.artifacts[0].id // empty')
          if [ -z "$ARTIFACT_ID" ]; then
            echo "::error::Step 1 아티팩트가 없습니다. 먼저 Step 1을 실행하세요."
            exit 1
          fi
          gh api "repos/${{ github.repository }}/actions/artifacts/$ARTIFACT_ID/zip" > /tmp/step1.zip
          unzip -o /tmp/step1.zip -d data/raw/
          CORP_CNT=$(tail -n +2 data/raw/listed_corps.csv | wc -l | tr -d ' ')
          echo "상장사 ${CORP_CNT}개 로드 완료"

      - name: Restore previous ownership data (체크포인트 + CSV)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARTIFACT_ID=$(gh api \
            "repos/${{ github.repository }}/actions/artifacts?name=step2-ownership-data&per_page=1" \
            --jq '.artifacts[0].id // empty')
          if [ -n "$ARTIFACT_ID" ]; then
            echo "이전 ownership 데이터 복원 중 (id=$ARTIFACT_ID)..."
            gh api "repos/${{ github.repository }}/actions/artifacts/$ARTIFACT_ID/zip" > /tmp/step2.zip
            unzip -o /tmp/step2.zip -d data/raw/
            ROWS=$(tail -n +2 data/raw/ownership_raw.csv 2>/dev/null | wc -l | tr -d ' ')
            echo "이전 데이터: ${ROWS}행"
          else
            echo "이전 데이터 없음 — 처음부터 시작"
          fi

      - name: Run Step 2
        run: python src/02_collect_ownership.py

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: step2-ownership-data
          path: |
            data/raw/ownership_raw.csv
            data/raw/ownership_checkpoint.json
            data/raw/.api_daily_counter.json
          retention-days: 90
          overwrite: true

      - name: Summary
        if: always()
        run: |
          python - <<'EOF'
          import json, os
          summary = []
          try:
              cp = json.load(open("data/raw/ownership_checkpoint.json"))
              done = sum(len(v) for v in cp.get("completed", {}).values())
              summary.append(f"완료: **{done:,}건**")
          except: pass
          try:
              import subprocess
              rows = int(subprocess.check_output(
                  ["wc", "-l", "data/raw/ownership_raw.csv"]
              ).split()[0]) - 1
              summary.append(f"수집 행수: **{rows:,}행**")
          except: pass
          try:
              ct = json.load(open("data/raw/.api_daily_counter.json"))
              summary.append(f"오늘 API 호출: **{ct['calls']:,}/10,000**")
          except: pass
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("## Step 2 결과\n")
              for s in summary:
                  f.write(f"- {s}\n")
          EOF

name: "Step 3 — 자사주 데이터 수집"

on:
  workflow_dispatch:
  schedule:
    # 매일 UTC 01:00 (한국 10:00) — Step 2 미완료 시 자동 스킵됨
    - cron: "0 1 * * *"

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Create .env
        run: echo "DART_API_KEY=${{ secrets.DART_API_KEY }}" > .env

      - name: Download listed_corps.csv (Step 1 artifact)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p data/raw
          ARTIFACT_ID=$(gh api \
            "repos/${{ github.repository }}/actions/artifacts?name=step1-corp-list&per_page=1" \
            --jq '.artifacts[0].id // empty')
          if [ -z "$ARTIFACT_ID" ]; then
            echo "::error::Step 1 아티팩트가 없습니다."
            exit 1
          fi
          gh api "repos/${{ github.repository }}/actions/artifacts/$ARTIFACT_ID/zip" > /tmp/step1.zip
          unzip -o /tmp/step1.zip -d data/raw/

      # ── Step 2 완료 여부 확인 ────────────────────────────────────────────
      - name: Check Step 2 completion
        id: check_step2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARTIFACT_ID=$(gh api \
            "repos/${{ github.repository }}/actions/artifacts?name=step2-ownership-data&per_page=1" \
            --jq '.artifacts[0].id // empty')

          if [ -z "$ARTIFACT_ID" ]; then
            echo "Step 2 artifact 없음 → 스킵"
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          gh api "repos/${{ github.repository }}/actions/artifacts/$ARTIFACT_ID/zip" > /tmp/step2_check.zip
          mkdir -p /tmp/step2_check
          unzip -o /tmp/step2_check.zip -d /tmp/step2_check/

          python - <<'PYEOF'
          import json, sys
          from pathlib import Path

          cp_path = Path("/tmp/step2_check/ownership_checkpoint.json")
          corps_path = Path("data/raw/listed_corps.csv")

          if not cp_path.exists():
              print("체크포인트 없음 → 스킵")
              Path("/tmp/step2_done").write_text("false")
              sys.exit(0)

          cp = json.loads(cp_path.read_text())
          done = sum(len(v) for v in cp.get("completed", {}).values())
          total_corps = sum(1 for _ in open(corps_path)) - 1
          total = total_corps * 11  # 2015~2025

          pct = done / total * 100 if total else 0
          print(f"Step 2 진행: {done:,}/{total:,} ({pct:.1f}%)")

          if done >= total:
              print("Step 2 완료 ✓ → Step 3 진행")
              Path("/tmp/step2_done").write_text("true")
          else:
              remaining = total - done
              print(f"Step 2 미완료 (잔여 {remaining:,}건) → Step 3 스킵")
              Path("/tmp/step2_done").write_text("false")
          PYEOF

          STEP2_DONE=$(cat /tmp/step2_done)
          echo "skip=$([ "$STEP2_DONE" = "true" ] && echo false || echo true)" >> $GITHUB_OUTPUT
          echo "Step 2 done=$STEP2_DONE"

      - name: Skip notice
        if: steps.check_step2.outputs.skip == 'true'
        run: |
          echo "⏭️  Step 2가 아직 완료되지 않았습니다. Step 3를 스킵합니다." | tee -a $GITHUB_STEP_SUMMARY
          echo "Step 2가 모두 완료된 후 Step 3가 자동 시작됩니다." >> $GITHUB_STEP_SUMMARY

      # ── 이후 스텝은 Step 2 완료 시에만 실행 ────────────────────────────

      - name: Restore shared daily counter
        if: steps.check_step2.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Step 2 artifact에서 오늘 사용한 카운터 복원
          cp /tmp/step2_check/.api_daily_counter.json data/raw/ 2>/dev/null || true

      - name: Restore previous treasury + total_shares data
        if: steps.check_step2.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARTIFACT_ID=$(gh api \
            "repos/${{ github.repository }}/actions/artifacts?name=step3-treasury-data&per_page=1" \
            --jq '.artifacts[0].id // empty')
          if [ -n "$ARTIFACT_ID" ]; then
            echo "이전 treasury 데이터 복원 중..."
            gh api "repos/${{ github.repository }}/actions/artifacts/$ARTIFACT_ID/zip" > /tmp/step3.zip
            unzip -o /tmp/step3.zip -d data/raw/
          else
            echo "첫 실행"
          fi

      - name: Run Step 3 — 자사주 수량 수집
        if: steps.check_step2.outputs.skip == 'false'
        run: python src/03_collect_treasury.py

      - name: Run Step 3b — 총발행주식수 수집
        if: steps.check_step2.outputs.skip == 'false'
        run: python src/03b_collect_total_shares.py

      - name: Upload artifact
        if: steps.check_step2.outputs.skip == 'false' && always()
        uses: actions/upload-artifact@v4
        with:
          name: step3-treasury-data
          path: |
            data/raw/treasury_raw.csv
            data/raw/treasury_checkpoint.json
            data/raw/total_shares_raw.csv
            data/raw/total_shares_checkpoint.json
            data/raw/.api_daily_counter.json
          retention-days: 90
          overwrite: true

      - name: Summary
        if: steps.check_step2.outputs.skip == 'false' && always()
        run: |
          python - <<'EOF'
          import json, os
          summary = []
          try:
              cp = json.load(open("data/raw/treasury_checkpoint.json"))
              done = sum(len(v) for v in cp.get("completed", {}).values())
              summary.append(f"자사주 완료: **{done:,}건**")
          except: pass
          try:
              cp = json.load(open("data/raw/total_shares_checkpoint.json"))
              done = sum(len(v) for v in cp.get("completed", {}).values())
              summary.append(f"총발행주식수 완료: **{done:,}건**")
          except: pass
          try:
              ct = json.load(open("data/raw/.api_daily_counter.json"))
              summary.append(f"오늘 API 호출: **{ct['calls']:,}/10,000**")
          except: pass
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("## Step 3 결과\n")
              for s in summary:
                  f.write(f"- {s}\n")
          EOF

name: "Step 3 — 자사주 + 총발행주식수 수집"

on:
  workflow_dispatch:
    inputs:
      force_reset:
        description: "기존 treasury/total_shares 데이터 삭제 후 전체 재수집 (trmend_rate 추가 등 스키마 변경 시 사용)"
        type: boolean
        default: false
  schedule:
    # 매일 UTC 01:00 (한국 10:00) 자동 실행 — Step 2 완료 후 이어서 수집
    - cron: "0 1 * * *"

concurrency:
  group: step3-treasury
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write   # Step 4 트리거용

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Create .env
        run: echo "DART_API_KEY=${{ secrets.DART_API_KEY }}" > .env

      - name: Download Step 1 artifact (listed_corps.csv)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p data/raw
          ARTIFACT_ID=$(gh api \
            "repos/${{ github.repository }}/actions/artifacts?name=step1-corp-list&per_page=1" \
            --jq '.artifacts[0].id // empty')
          if [ -z "$ARTIFACT_ID" ]; then
            echo "::error::Step 1 아티팩트가 없습니다."
            exit 1
          fi
          gh api "repos/${{ github.repository }}/actions/artifacts/$ARTIFACT_ID/zip" > /tmp/step1.zip
          unzip -o /tmp/step1.zip -d data/raw/

      # ── Step 2 완료 여부 확인 (WARNING만 — 수동 트리거 허용) ─────────────
      - name: Check Step 2 completion (warning only)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARTIFACT_ID=$(gh api \
            "repos/${{ github.repository }}/actions/artifacts?name=step2-ownership-data&per_page=1" \
            --jq '.artifacts[0].id // empty')

          if [ -z "$ARTIFACT_ID" ]; then
            echo "::warning::Step 2 아티팩트 없음. 수동 실행으로 간주하고 계속합니다."
            exit 0
          fi

          mkdir -p /tmp/step2_check
          gh api "repos/${{ github.repository }}/actions/artifacts/$ARTIFACT_ID/zip" > /tmp/step2_check.zip
          unzip -o /tmp/step2_check.zip -d /tmp/step2_check/

          python - <<'PYEOF'
          import json, sys
          from pathlib import Path

          cp_path = Path("/tmp/step2_check/ownership_checkpoint.json")
          corps_path = Path("data/raw/listed_corps.csv")

          if not cp_path.exists():
              print("::warning::Step 2 체크포인트 없음.")
              sys.exit(0)

          cp = json.loads(cp_path.read_text())
          done = sum(len(v) for v in cp.get("completed", {}).values())
          total = (sum(1 for _ in open(corps_path)) - 1) * 11

          if done < total:
              pct = done / total * 100 if total else 0
              print(f"::warning::Step 2 미완료 ({done:,}/{total:,}, {pct:.1f}%). 수동 실행으로 계속합니다.")
          else:
              print(f"✅ Step 2 완료 확인 ({done:,}/{total:,})")
          PYEOF

      # ── 공유 일일 카운터 복원 (날짜 일치 확인 필수) ──────────────────────
      - name: Restore shared daily counter from Step 2
        run: |
          COUNTER_FILE="/tmp/step2_check/.api_daily_counter.json"
          if [ ! -f "$COUNTER_FILE" ]; then
            echo "Step 2 카운터 없음 — 새 카운터로 시작"
            exit 0
          fi

          COUNTER_DATE=$(python -c "import json; print(json.load(open('$COUNTER_FILE'))['date'])")
          TODAY=$(date -u +%Y-%m-%d)

          if [ "$COUNTER_DATE" = "$TODAY" ]; then
            cp "$COUNTER_FILE" data/raw/.api_daily_counter.json
            CALLS=$(python -c "import json; print(json.load(open('data/raw/.api_daily_counter.json'))['calls'])")
            echo "✅ 카운터 복원 완료: 오늘 이미 ${CALLS}/10,000 사용"
          else
            echo "⚠️  카운터 날짜 불일치 (저장: $COUNTER_DATE, 오늘: $TODAY) — 새 카운터 사용"
          fi

      # ── force_reset 시 기존 데이터 백업 후 초기화 ───────────────────────
      - name: Backup existing treasury data before force_reset
        if: github.event_name == 'workflow_dispatch' && inputs.force_reset == true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/backup_data
          ARTIFACT_ID=$(gh api \
            "repos/${{ github.repository }}/actions/artifacts?name=step3-treasury-data&per_page=1" \
            --jq '.artifacts[0].id // empty')
          if [ -n "$ARTIFACT_ID" ]; then
            echo "기존 treasury 데이터 백업용 다운로드 중 (id=$ARTIFACT_ID)..."
            gh api "repos/${{ github.repository }}/actions/artifacts/$ARTIFACT_ID/zip" > /tmp/backup.zip
            unzip -o /tmp/backup.zip -d /tmp/backup_data/
            echo "✅ 백업 다운로드 완료"
          else
            echo "백업할 기존 데이터 없음"
          fi

      - name: Upload backup artifact (force_reset only)
        if: github.event_name == 'workflow_dispatch' && inputs.force_reset == true
        uses: actions/upload-artifact@v4
        with:
          name: step3-treasury-data-backup-${{ github.run_id }}
          path: /tmp/backup_data/
          retention-days: 30

      - name: Reset treasury checkpoints (force_reset only)
        if: github.event_name == 'workflow_dispatch' && inputs.force_reset == true
        run: |
          echo "⚠️  force_reset=true — 체크포인트 초기화 및 CSV 삭제"
          echo '{"completed": {}}' > data/raw/treasury_checkpoint.json
          echo '{"completed": {}}' > data/raw/total_shares_checkpoint.json
          rm -f data/raw/treasury_raw.csv data/raw/total_shares_raw.csv
          echo "✅ 초기화 완료 — 전체 재수집 시작"

      - name: Restore previous treasury + total_shares data (일반 실행)
        if: github.event_name != 'workflow_dispatch' || inputs.force_reset != true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARTIFACT_ID=$(gh api \
            "repos/${{ github.repository }}/actions/artifacts?name=step3-treasury-data&per_page=1" \
            --jq '.artifacts[0].id // empty')
          if [ -n "$ARTIFACT_ID" ]; then
            echo "이전 treasury 데이터 복원 중..."
            gh api "repos/${{ github.repository }}/actions/artifacts/$ARTIFACT_ID/zip" > /tmp/step3.zip
            unzip -o /tmp/step3.zip -d data/raw/
          else
            echo "첫 실행"
          fi

      # ── Step 3 이미 완료됐는지 확인 (03 + 03b 둘 다) ────────────────────
      - name: Check if Step 3 already complete
        id: pre_check
        run: |
          python - <<'PYEOF'
          import json
          from pathlib import Path

          corps_path = Path("data/raw/listed_corps.csv")
          total = (sum(1 for _ in open(corps_path)) - 1) * 11

          def check_cp(path):
              if not Path(path).exists():
                  return 0
              cp = json.loads(Path(path).read_text())
              return sum(len(v) for v in cp.get("completed", {}).values())

          done_t = check_cp("data/raw/treasury_checkpoint.json")
          done_s = check_cp("data/raw/total_shares_checkpoint.json")

          print(f"자사주(03):       {done_t:,}/{total:,}")
          print(f"총발행주식수(03b): {done_s:,}/{total:,}")

          both_done = (done_t >= total) and (done_s >= total)
          Path("/tmp/step3_already_done").write_text("true" if both_done else "false")

          if both_done:
              print("✅ Step 3 (03 + 03b) 이미 완료 — 스크립트 스킵")
          else:
              print(f"⏳ 잔여: 자사주 {total - done_t:,}건, 총발행주식수 {total - done_s:,}건")
          PYEOF

          echo "already_done=$(cat /tmp/step3_already_done)" >> $GITHUB_OUTPUT

      - name: Run Step 3 — 자사주 수집 (미완료 시에만)
        if: steps.pre_check.outputs.already_done == 'false'
        run: python src/03_collect_treasury.py

      - name: Run Step 3b — 총발행주식수 수집 (미완료 시에만)
        if: steps.pre_check.outputs.already_done == 'false'
        run: python src/03b_collect_total_shares.py

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: step3-treasury-data
          path: |
            data/raw/treasury_raw.csv
            data/raw/treasury_checkpoint.json
            data/raw/total_shares_raw.csv
            data/raw/total_shares_checkpoint.json
            data/raw/.api_daily_counter.json
          retention-days: 90
          overwrite: true

      # ── 03 + 03b 둘 다 완료 시에만 Step 4 트리거 ────────────────────────
      - name: Auto-trigger Step 4 if complete (03 AND 03b)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PYEOF'
          import json
          from pathlib import Path

          corps_path = Path("data/raw/listed_corps.csv")
          total = (sum(1 for _ in open(corps_path)) - 1) * 11

          def check_cp(path):
              if not Path(path).exists():
                  return 0
              cp = json.loads(Path(path).read_text())
              return sum(len(v) for v in cp.get("completed", {}).values())

          done_t = check_cp("data/raw/treasury_checkpoint.json")
          done_s = check_cp("data/raw/total_shares_checkpoint.json")

          both_done = (done_t >= total) and (done_s >= total)
          Path("/tmp/trigger_step4").write_text("true" if both_done else "false")

          if both_done:
              print(f"✅ Step 3 완료 (03: {done_t:,}, 03b: {done_s:,}) → Step 4 트리거 예정")
          else:
              print(f"⏳ 미완료 — 03: {done_t:,}/{total:,}, 03b: {done_s:,}/{total:,}")
          PYEOF

          if [ "$(cat /tmp/trigger_step4)" = "true" ]; then
            echo "Step 4 워크플로우 트리거 중..."
            gh workflow run step4-minority.yml --ref "${{ github.ref_name }}"
            echo "✅ Step 4 트리거 완료"
          fi

      - name: Summary
        if: always()
        run: |
          python - <<'EOF'
          import json, os
          summary = []
          for label, cp_file in [("자사주(03)", "data/raw/treasury_checkpoint.json"),
                                  ("총발행주식수(03b)", "data/raw/total_shares_checkpoint.json")]:
              try:
                  cp = json.load(open(cp_file))
                  done = sum(len(v) for v in cp.get("completed", {}).values())
                  summary.append(f"{label} 완료: **{done:,}건**")
              except: pass
          try:
              ct = json.load(open("data/raw/.api_daily_counter.json"))
              summary.append(f"오늘 API 호출: **{ct['calls']:,}/10,000**")
          except: pass
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("## Step 3 결과\n")
              for s in summary:
                  f.write(f"- {s}\n")
          EOF

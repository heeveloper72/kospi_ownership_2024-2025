name: "Step 4 — 소액주주 데이터 수집"

on:
  workflow_dispatch:
  # schedule 제거 — Step 3 완료 시 자동 트리거되므로 별도 스케줄 불필요

concurrency:
  group: step4-minority
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Create .env
        run: echo "DART_API_KEY=${{ secrets.DART_API_KEY }}" > .env

      - name: Download Step 1 artifact (listed_corps.csv)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p data/raw
          ARTIFACT_ID=$(gh api \
            "repos/${{ github.repository }}/actions/artifacts?name=step1-corp-list&per_page=1" \
            --jq '.artifacts[0].id // empty')
          if [ -z "$ARTIFACT_ID" ]; then
            echo "::error::Step 1 아티팩트가 없습니다."
            exit 1
          fi
          gh api "repos/${{ github.repository }}/actions/artifacts/$ARTIFACT_ID/zip" > /tmp/step1.zip
          unzip -o /tmp/step1.zip -d data/raw/

      # ── Step 3 완료 여부 확인 (WARNING만 — 수동 트리거 허용) ─────────────
      - name: Check Step 3 completion (warning only)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARTIFACT_ID=$(gh api \
            "repos/${{ github.repository }}/actions/artifacts?name=step3-treasury-data&per_page=1" \
            --jq '.artifacts[0].id // empty')

          if [ -z "$ARTIFACT_ID" ]; then
            echo "::warning::Step 3 아티팩트 없음. 수동 실행으로 간주하고 계속합니다."
            exit 0
          fi

          mkdir -p /tmp/step3_check
          gh api "repos/${{ github.repository }}/actions/artifacts/$ARTIFACT_ID/zip" > /tmp/step3_check.zip
          unzip -o /tmp/step3_check.zip -d /tmp/step3_check/

          python - <<'PYEOF'
          import json, sys
          from pathlib import Path

          corps_path = Path("data/raw/listed_corps.csv")
          total = (sum(1 for _ in open(corps_path)) - 1) * 11

          def check_cp(path):
              if not Path(path).exists(): return 0
              cp = json.loads(Path(path).read_text())
              return sum(len(v) for v in cp.get("completed", {}).values())

          done_t = check_cp("/tmp/step3_check/treasury_checkpoint.json")
          done_s = check_cp("/tmp/step3_check/total_shares_checkpoint.json")
          both_done = (done_t >= total) and (done_s >= total)

          if not both_done:
              print(f"::warning::Step 3 미완료 (03: {done_t:,}/{total:,}, 03b: {done_s:,}/{total:,}). 수동 실행으로 계속합니다.")
          else:
              print(f"✅ Step 3 완료 확인")
          PYEOF

      # ── 공유 일일 카운터 복원 (날짜 일치 확인 필수) ──────────────────────
      - name: Restore shared daily counter from Step 3
        run: |
          COUNTER_FILE="/tmp/step3_check/.api_daily_counter.json"
          if [ ! -f "$COUNTER_FILE" ]; then
            echo "Step 3 카운터 없음 — 새 카운터로 시작"
            exit 0
          fi

          COUNTER_DATE=$(python -c "import json; print(json.load(open('$COUNTER_FILE'))['date'])")
          TODAY=$(date -u +%Y-%m-%d)

          if [ "$COUNTER_DATE" = "$TODAY" ]; then
            cp "$COUNTER_FILE" data/raw/.api_daily_counter.json
            CALLS=$(python -c "import json; print(json.load(open('data/raw/.api_daily_counter.json'))['calls'])")
            echo "✅ 카운터 복원 완료: 오늘 이미 ${CALLS}/10,000 사용"
          else
            echo "⚠️  카운터 날짜 불일치 (저장: $COUNTER_DATE, 오늘: $TODAY) — 새 카운터 사용"
          fi

      - name: Restore previous minority data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARTIFACT_ID=$(gh api \
            "repos/${{ github.repository }}/actions/artifacts?name=step4-minority-data&per_page=1" \
            --jq '.artifacts[0].id // empty')
          if [ -n "$ARTIFACT_ID" ]; then
            echo "이전 minority 데이터 복원 중..."
            gh api "repos/${{ github.repository }}/actions/artifacts/$ARTIFACT_ID/zip" > /tmp/step4.zip
            unzip -o /tmp/step4.zip -d data/raw/
          else
            echo "첫 실행"
          fi

      # ── Step 4 이미 완료됐는지 확인 ──────────────────────────────────────
      - name: Check if Step 4 already complete
        id: pre_check
        run: |
          python - <<'PYEOF'
          import json
          from pathlib import Path

          cp_path = Path("data/raw/minority_checkpoint.json")
          corps_path = Path("data/raw/listed_corps.csv")

          if not cp_path.exists():
              Path("/tmp/step4_already_done").write_text("false")
              print("체크포인트 없음 — 처음부터 수집")
              exit()

          cp = json.loads(cp_path.read_text())
          done = sum(len(v) for v in cp.get("completed", {}).values())
          total = (sum(1 for _ in open(corps_path)) - 1) * 11

          if done >= total:
              print(f"✅ Step 4 이미 완료 ({done:,}/{total:,}) — 스크립트 스킵")
              Path("/tmp/step4_already_done").write_text("true")
          else:
              print(f"⏳ 잔여 {total - done:,}건 — 수집 시작")
              Path("/tmp/step4_already_done").write_text("false")
          PYEOF

          echo "already_done=$(cat /tmp/step4_already_done)" >> $GITHUB_OUTPUT

      - name: Run Step 4 (미완료 시에만)
        if: steps.pre_check.outputs.already_done == 'false'
        run: python src/04_collect_minority.py

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: step4-minority-data
          path: |
            data/raw/minority_raw.csv
            data/raw/minority_checkpoint.json
            data/raw/.api_daily_counter.json
          retention-days: 90
          overwrite: true

      # ── Step 4 완료 시 수집 파이프라인 완료 안내 ────────────────────────
      - name: Check collection complete
        run: |
          python - <<'PYEOF'
          import json
          from pathlib import Path

          cp = json.loads(Path("data/raw/minority_checkpoint.json").read_text())
          done = sum(len(v) for v in cp.get("completed", {}).values())
          total = (sum(1 for _ in open("data/raw/listed_corps.csv")) - 1) * 11

          if done >= total:
              print("🎉 Step 2~4 전체 수집 완료!")
              print("다음 단계: GitHub Actions에서 Step 5 (Clean & Merge) 수동 실행")
          else:
              print(f"⏳ Step 4 진행중 ({done:,}/{total:,}) — 내일 자동 재개")
          PYEOF

      - name: Summary
        if: always()
        run: |
          python - <<'EOF'
          import json, os
          summary = []
          try:
              cp = json.load(open("data/raw/minority_checkpoint.json"))
              done = sum(len(v) for v in cp.get("completed", {}).values())
              summary.append(f"완료: **{done:,}건**")
          except: pass
          try:
              ct = json.load(open("data/raw/.api_daily_counter.json"))
              summary.append(f"오늘 API 호출: **{ct['calls']:,}/10,000**")
          except: pass
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("## Step 4 결과\n")
              for s in summary:
                  f.write(f"- {s}\n")
          EOF

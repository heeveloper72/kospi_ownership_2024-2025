name: "Step 5 — 데이터 정제 & 병합"

on:
  workflow_dispatch:

jobs:
  process:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write   # Step 6 자동 트리거용

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - run: pip install -r requirements.txt

      # Step 2, 3, 4 아티팩트에서 raw CSV 다운로드
      - name: Download raw data artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p data/raw data/processed

          download_artifact() {
            local NAME=$1
            local ARTIFACT_ID
            ARTIFACT_ID=$(gh api \
              "repos/${{ github.repository }}/actions/artifacts?name=${NAME}&per_page=1" \
              --jq '.artifacts[0].id // empty')
            if [ -n "$ARTIFACT_ID" ]; then
              echo "${NAME} 다운로드 중 (id=$ARTIFACT_ID)..."
              gh api "repos/${{ github.repository }}/actions/artifacts/$ARTIFACT_ID/zip" > /tmp/${NAME}.zip
              unzip -o /tmp/${NAME}.zip -d data/raw/
            else
              echo "::warning::${NAME} 아티팩트 없음"
            fi
          }

          download_artifact step2-ownership-data   # ownership_raw.csv (필수)
          download_artifact step3-treasury-data    # treasury_raw.csv + total_shares_raw.csv (선택)
          download_artifact step4-minority-data    # minority_raw.csv (선택)

          # 필수 파일 확인
          if [ ! -f data/raw/ownership_raw.csv ]; then
            echo "::error::ownership_raw.csv 없음. Step 2를 먼저 완료하세요."
            exit 1
          fi

          ROWS=$(tail -n +2 data/raw/ownership_raw.csv | wc -l | tr -d ' ')
          echo "ownership_raw.csv: ${ROWS}행"

          # treasury_raw.csv trmend_rate 컬럼 존재 확인
          if [ -f data/raw/treasury_raw.csv ]; then
            python - <<'PYEOF'
          import pandas as pd
          df = pd.read_csv("data/raw/treasury_raw.csv", nrows=1)
          if "trmend_rate" in df.columns:
              print("✅ treasury_raw.csv — trmend_rate 컬럼 존재")
          else:
              print("::warning::treasury_raw.csv — trmend_rate 컬럼 없음 (Step 3 재수집 필요)")
          PYEOF
          fi

      - name: Run Step 5
        run: python src/05_clean_merge.py

      - name: Upload panel artifact
        uses: actions/upload-artifact@v4
        with:
          name: step5-panel-data
          path: data/processed/ownership_panel.csv
          retention-days: 90
          overwrite: true

      - name: Auto-trigger Step 6
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Step 6 워크플로우 트리거 중..."
          gh workflow run step6-analyze.yml --ref "${{ github.ref_name }}"
          echo "✅ Step 6 트리거 완료"

      - name: Summary
        run: |
          python - <<'EOF'
          import pandas as pd, os
          df = pd.read_csv("data/processed/ownership_panel.csv")
          lines = [
              "## Step 5 결과",
              f"| 항목 | 값 |",
              f"|------|---|",
              f"| 총 관측치 | **{len(df):,}건** |",
              f"| 연도 범위 | {df['year'].min()} ~ {df['year'].max()} |",
              f"| KOSPI | {(df['market']=='KOSPI').sum():,}건 |",
              f"| KOSDAQ | {(df['market']=='KOSDAQ').sum():,}건 |",
              f"| 최대주주 평균 | {df['largest_pct'].mean():.2f}% |",
              f"| 우호지분 평균 | {df['friendly_pct'].mean():.2f}% |",
              f"| 자사주 평균 | {df['treasury_pct'].mean():.2f}% |",
          ]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("\n".join(lines))
          EOF

name: "Step 6 — 통계 분석"

on:
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Download panel data (Step 5 artifact)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p data/processed data/output
          ARTIFACT_ID=$(gh api \
            "repos/${{ github.repository }}/actions/artifacts?name=step5-panel-data&per_page=1" \
            --jq '.artifacts[0].id // empty')
          if [ -z "$ARTIFACT_ID" ]; then
            echo "::error::Step 5 아티팩트가 없습니다. 먼저 Step 5를 실행하세요."
            exit 1
          fi
          gh api "repos/${{ github.repository }}/actions/artifacts/$ARTIFACT_ID/zip" > /tmp/step5.zip
          unzip -o /tmp/step5.zip -d data/processed/
          ROWS=$(tail -n +2 data/processed/ownership_panel.csv | wc -l | tr -d ' ')
          echo "패널 데이터: ${ROWS}행"

      - name: Run Step 6
        run: python src/06_analyze.py

      - name: Upload analysis artifact
        uses: actions/upload-artifact@v4
        with:
          name: step6-analysis
          path: data/output/yearly_stats_*.csv
          retention-days: 90
          overwrite: true

      - name: Summary — 벤치마크 비교
        run: |
          python - <<'EOF'
          import pandas as pd, os

          BENCHMARK = {
              "전체": {"largest_pct_mean": 29.21, "friendly_pct_mean": 43.07},
              "KOSPI": {"friendly_pct_mean": 49.34},
              "KOSDAQ": {"friendly_pct_mean": 39.93},
          }

          lines = ["## Step 6 결과 — 2023년 벤치마크 비교\n",
                   "| 구분 | 지표 | 분석값 | 벤치마크 | 차이 |",
                   "|------|------|--------|---------|------|"]

          for fname, label, bm in [
              ("yearly_stats_total.csv",  "전체",  BENCHMARK["전체"]),
              ("yearly_stats_kospi.csv",  "KOSPI", BENCHMARK["KOSPI"]),
              ("yearly_stats_kosdaq.csv", "KOSDAQ",BENCHMARK["KOSDAQ"]),
          ]:
              try:
                  df = pd.read_csv(f"data/output/{fname}")
                  row = df[df["year"].astype(str) == "2023"]
                  if row.empty:
                      continue
                  for col, bm_val in bm.items():
                      val = row[col].values[0]
                      diff = val - bm_val
                      sign = "+" if diff >= 0 else ""
                      lines.append(
                          f"| {label} | {col} | {val:.2f}% | {bm_val:.2f}% | {sign}{diff:.2f}%p |"
                      )
              except Exception as e:
                  lines.append(f"| {label} | - | 오류: {e} | - | - |")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("\n".join(lines))
          EOF

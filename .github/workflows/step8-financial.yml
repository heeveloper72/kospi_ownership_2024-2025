name: "Step 8 — 재무데이터 수집 (H1·H5 통제변수)"

# schedule은 Step 3 재수집 완료(~2026-04-27) 후 별도 커밋으로 해제.
# 현재 Step 3이 일일 10,000 예산을 전부 사용 중이므로 schedule 활성화 시 한도 초과.
on:
  workflow_dispatch:
    inputs:
      force_reset:
        description: "기존 financial 데이터 삭제 후 전체 재수집 (스키마 변경 시)"
        type: boolean
        default: false
  # schedule:
  #   # Step 3 완료 확인 후 주석 해제 예정 — 매일 UTC 03:00 (한국 12:00)
  #   - cron: "0 3 * * *"

concurrency:
  group: step8-financial
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Create .env
        run: echo "DART_API_KEY=${{ secrets.DART_API_KEY }}" > .env

      - name: Download Step 1 artifact (listed_corps.csv)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p data/raw
          ARTIFACT_ID=$(gh api \
            "repos/${{ github.repository }}/actions/artifacts?name=step1-corp-list&per_page=1" \
            --jq '.artifacts[0].id // empty')
          if [ -z "$ARTIFACT_ID" ]; then
            echo "::error::Step 1 아티팩트가 없습니다."
            exit 1
          fi
          gh api "repos/${{ github.repository }}/actions/artifacts/$ARTIFACT_ID/zip" > /tmp/step1.zip
          unzip -o /tmp/step1.zip -d data/raw/

      # ── 일일 예산 충돌 확인: Step 3 완료 전 실행 방지 ─────────────────────
      # step4 자동 트리거 시에는 Step 3이 이미 완료됐으므로 항상 통과.
      # 수동 실행 실수 방어: 미완료 시 skip(exit 0) + 경고 출력.
      - name: Check Step 3 completion
        id: step3_check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARTIFACT_ID=$(gh api \
            "repos/${{ github.repository }}/actions/artifacts?name=step3-treasury-data&per_page=1" \
            --jq '.artifacts[0].id // empty')

          if [ -z "$ARTIFACT_ID" ]; then
            echo "::warning::Step 3 아티팩트 없음 — 첫 수동 실행으로 간주하고 진행합니다."
            echo "step3_done=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          mkdir -p /tmp/step3_check
          gh api "repos/${{ github.repository }}/actions/artifacts/$ARTIFACT_ID/zip" > /tmp/step3_check.zip
          unzip -o /tmp/step3_check.zip -d /tmp/step3_check/

          python - <<'PYEOF'
          import json, sys, os
          from pathlib import Path

          corps_path = Path("data/raw/listed_corps.csv")
          total = (sum(1 for _ in open(corps_path)) - 1) * 11

          def check_cp(path):
              if not Path(path).exists(): return 0
              cp = json.loads(Path(path).read_text())
              return sum(len(v) for v in cp.get("completed", {}).values())

          done_t = check_cp("/tmp/step3_check/treasury_checkpoint.json")
          done_s = check_cp("/tmp/step3_check/total_shares_checkpoint.json")
          both_done = (done_t >= total) and (done_s >= total)

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"step3_done={'true' if both_done else 'false'}\n")

          if not both_done:
              print(f"::warning::Step 3 미완료 (03: {done_t:,}/{total:,}, 03b: {done_s:,}/{total:,}).")
              print("Step 4 완료 시 자동 트리거됩니다. 지금은 스킵합니다.")
          else:
              print(f"✅ Step 3 완료 확인 ({done_t:,}/{total:,}) — Step 8 착수 가능")
          PYEOF

      # ── 공유 일일 카운터 복원 ────────────────────────────────────────────
      - name: Restore shared daily counter from Step 3
        if: steps.step3_check.outputs.step3_done == 'true'
        run: |
          COUNTER_FILE="/tmp/step3_check/.api_daily_counter.json"
          if [ ! -f "$COUNTER_FILE" ]; then
            echo "Step 3 카운터 없음 — 새 카운터로 시작"
            exit 0
          fi

          COUNTER_DATE=$(python -c "import json; print(json.load(open('$COUNTER_FILE'))['date'])")
          TODAY=$(date -u +%Y-%m-%d)

          if [ "$COUNTER_DATE" = "$TODAY" ]; then
            cp "$COUNTER_FILE" data/raw/.api_daily_counter.json
            CALLS=$(python -c "import json; print(json.load(open('data/raw/.api_daily_counter.json'))['calls'])")
            echo "✅ 카운터 복원 완료: 오늘 이미 ${CALLS}/10,000 사용"
          else
            echo "⚠️  카운터 날짜 불일치 (저장: $COUNTER_DATE, 오늘: $TODAY) — 새 카운터 사용"
          fi

      # ── force_reset 시 기존 데이터 백업 후 초기화 ───────────────────────
      - name: Backup existing financial data before force_reset
        if: github.event_name == 'workflow_dispatch' && inputs.force_reset == true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/backup_data
          ARTIFACT_ID=$(gh api \
            "repos/${{ github.repository }}/actions/artifacts?name=step8-financial-data&per_page=1" \
            --jq '.artifacts[0].id // empty')
          if [ -n "$ARTIFACT_ID" ]; then
            echo "기존 financial 데이터 백업용 다운로드 중 (id=$ARTIFACT_ID)..."
            gh api "repos/${{ github.repository }}/actions/artifacts/$ARTIFACT_ID/zip" > /tmp/backup.zip
            unzip -o /tmp/backup.zip -d /tmp/backup_data/
            echo "✅ 백업 다운로드 완료"
          else
            echo "백업할 기존 데이터 없음"
          fi

      - name: Upload backup artifact (force_reset only)
        if: github.event_name == 'workflow_dispatch' && inputs.force_reset == true
        uses: actions/upload-artifact@v4
        with:
          name: step8-financial-data-backup-${{ github.run_id }}
          path: /tmp/backup_data/
          retention-days: 30

      - name: Reset financial checkpoint (force_reset only)
        if: github.event_name == 'workflow_dispatch' && inputs.force_reset == true
        run: |
          echo "⚠️  force_reset=true — 체크포인트 초기화 및 CSV 삭제"
          echo '{"completed": {}}' > data/raw/financial_checkpoint.json
          rm -f data/raw/financial_raw.csv
          echo "✅ 초기화 완료 — 전체 재수집 시작"

      - name: Restore previous financial data (일반 실행)
        if: steps.step3_check.outputs.step3_done == 'true' && (github.event_name != 'workflow_dispatch' || inputs.force_reset != true)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARTIFACT_ID=$(gh api \
            "repos/${{ github.repository }}/actions/artifacts?name=step8-financial-data&per_page=1" \
            --jq '.artifacts[0].id // empty')
          if [ -n "$ARTIFACT_ID" ]; then
            echo "이전 financial 데이터 복원 중..."
            gh api "repos/${{ github.repository }}/actions/artifacts/$ARTIFACT_ID/zip" > /tmp/step8.zip
            unzip -o /tmp/step8.zip -d data/raw/
          else
            echo "첫 실행"
          fi

      # ── Step 8 이미 완료됐는지 확인 ──────────────────────────────────────
      - name: Check if Step 8 already complete
        id: pre_check
        if: steps.step3_check.outputs.step3_done == 'true'
        run: |
          python - <<'PYEOF'
          import json
          from pathlib import Path

          cp_path = Path("data/raw/financial_checkpoint.json")
          corps_path = Path("data/raw/listed_corps.csv")

          if not cp_path.exists():
              Path("/tmp/step8_already_done").write_text("false")
              print("체크포인트 없음 — 처음부터 수집")
              exit()

          cp = json.loads(cp_path.read_text())
          done = sum(len(v) for v in cp.get("completed", {}).values())
          total = (sum(1 for _ in open(corps_path)) - 1) * 11

          if done >= total:
              print(f"✅ Step 8 이미 완료 ({done:,}/{total:,}) — 스크립트 스킵")
              Path("/tmp/step8_already_done").write_text("true")
          else:
              print(f"⏳ 잔여 {total - done:,}건 — 수집 시작")
              Path("/tmp/step8_already_done").write_text("false")
          PYEOF

          echo "already_done=$(cat /tmp/step8_already_done)" >> $GITHUB_OUTPUT

      - name: Run Step 8 (미완료 시에만)
        if: steps.step3_check.outputs.step3_done == 'true' && steps.pre_check.outputs.already_done == 'false'
        run: python src/08_collect_financial.py

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: step8-financial-data
          path: |
            data/raw/financial_raw.csv
            data/raw/financial_checkpoint.json
            data/raw/.api_daily_counter.json
          retention-days: 90
          overwrite: true

      - name: Summary
        if: always()
        run: |
          python - <<'EOF'
          import json, os
          summary = []
          try:
              cp = json.load(open("data/raw/financial_checkpoint.json"))
              done = sum(len(v) for v in cp.get("completed", {}).values())
              summary.append(f"완료: **{done:,}건**")
          except: pass
          try:
              import subprocess
              rows = int(subprocess.check_output(
                  ["wc", "-l", "data/raw/financial_raw.csv"]
              ).split()[0]) - 1
              summary.append(f"수집 행수: **{rows:,}행**")
          except: pass
          try:
              ct = json.load(open("data/raw/.api_daily_counter.json"))
              summary.append(f"오늘 API 호출: **{ct['calls']:,}/10,000**")
          except: pass
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("## Step 8 결과\n")
              for s in summary:
                  f.write(f"- {s}\n")
          EOF
